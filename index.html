<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart ADAS & Face Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        /* 편안한 색상 테마 및 기본 초기화 */
        :root {
            --bg-color: #1e272e;
            --panel-bg: #2c3e50;
            --text-color: #ecf0f1;
            --btn-color: #3498db;
            --btn-hover: #2980b9;
            --btn-active: #e67e22; /* 활성화된 기능 버튼 색상 */
            --danger-color: #e74c3c;
            --box-color: #00d2d3; 
            --lane-color: #2ecc71; /* 차선 인식 영역 색상 */
        }
        body {
            margin: 0; 
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 모바일에 맞춘 풀스크린 UI 컨테이너 */
        .mobile-container {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 상단 및 하단 제어 메뉴바 */
        .menu-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap; /* 버튼이 많아지면 줄바꿈 허용 */
        }
        .menu-bar.bottom {
            margin-bottom: 0;
            margin-top: 10px;
            border-bottom: none;
            border-top: 1px solid #34495e;
            padding-top: 10px;
        }
        
        button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            min-width: 80px;
        }
        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
        button.active { background-color: var(--btn-active); }
        button.danger { background-color: var(--danger-color); }

        /* 비디오 및 캔버스 래퍼 */
        .video-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid transparent; /* 경고 발생 시 색상 변경을 위한 테두리 */
            transition: border-color 0.2s;
        }
        .video-wrapper.warning {
            border-color: var(--danger-color);
            box-shadow: inset 0 0 20px rgba(231, 76, 60, 0.8);
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 하단 상태바 */
        #status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #bdc3c7;
            text-align: center;
            word-break: keep-all;
            height: 20px;
        }
        #warningMsg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="menu-bar">
        <button id="startBtn" disabled>카메라 켜기</button>
        <button id="switchBtn" disabled>전/후면 전환</button>
        <button id="stopBtn" disabled class="danger">끄기</button>
    </div>
    
    <div class="video-wrapper" id="videoWrapper">
        <div id="warningMsg">차선 이탈 주의!</div>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="menu-bar bottom">
        <button id="faceToggleBtn" class="active">얼굴 추적 (ON)</button>
        <button id="laneToggleBtn">차선 방지 (OFF)</button>
    </div>

    <div id="status">인공지능 모델을 불러오는 중입니다...</div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true }); // 픽셀 처리를 위한 최적화
    const videoWrapper = document.getElementById('videoWrapper');
    
    // 버튼 요소
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const switchBtn = document.getElementById('switchBtn');
    const faceToggleBtn = document.getElementById('faceToggleBtn');
    const laneToggleBtn = document.getElementById('laneToggleBtn');
    const statusText = document.getElementById('status');
    const warningMsg = document.getElementById('warningMsg');
    
    let stream = null;
    let mainInterval = null;
    let currentFacingMode = "environment"; // 기본값: 후면 카메라 (블랙박스 용도)

    // 기능 활성화 플래그
    let isFaceTrackingOn = true;
    let isLaneDetectionOn = false;

    // 경고음 오디오 객체 생성
    const beepSound = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'); // 짧은 비프음 더미 (브라우저 정책상 사용자 상호작용 후 재생 가능)

    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    // 1. 모델 로드 (얼굴 인식용)
    async function initModels() {
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            statusText.innerText = "시스템 준비 완료!";
            startBtn.disabled = false;
        } catch (error) {
            statusText.innerText = "모델 로드 실패. 인터넷을 확인해주세요.";
        }
    }

    // 2. 카메라 시작 함수
    async function startCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            video.srcObject = stream;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            switchBtn.disabled = false;
            statusText.innerText = currentFacingMode === 'user' ? "전면 카메라 작동 중" : "후면 카메라 작동 중 (ADAS 모드)";
        } catch (err) {
            statusText.innerText = "카메라 권한이 차단되었거나 기기를 찾을 수 없습니다.";
        }
    }

    startBtn.addEventListener('click', startCamera);

    // 3. 카메라 전/후면 전환
    switchBtn.addEventListener('click', () => {
        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        startCamera();
    });

    // 4. 카메라 끄기
    stopBtn.addEventListener('click', () => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        clearInterval(mainInterval);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        switchBtn.disabled = true;
        statusText.innerText = "카메라 종료됨.";
        resetWarning();
    });

    // 5. 기능 토글 버튼 로직
    faceToggleBtn.addEventListener('click', () => {
        isFaceTrackingOn = !isFaceTrackingOn;
        faceToggleBtn.innerText = `얼굴 추적 (${isFaceTrackingOn ? 'ON' : 'OFF'})`;
        faceToggleBtn.classList.toggle('active', isFaceTrackingOn);
    });

    laneToggleBtn.addEventListener('click', () => {
        isLaneDetectionOn = !isLaneDetectionOn;
        laneToggleBtn.innerText = `차선 방지 (${isLaneDetectionOn ? 'ON' : 'OFF'})`;
        laneToggleBtn.classList.toggle('active', isLaneDetectionOn);
        if(!isLaneDetectionOn) resetWarning();
    });

    // 6. 하드웨어 연동을 위한 이벤트 후크 (Event Hook)
    function triggerLaneDepartureWarning() {
        videoWrapper.classList.add('warning');
        warningMsg.style.display = 'block';
        // 추후 아두이노 통신 코드(Web Serial API 등)를 여기에 추가하세요.
        // 예: if(port) { writer.write(new Uint8Array([1])); }
    }

    function resetWarning() {
        videoWrapper.classList.remove('warning');
        warningMsg.style.display = 'none';
    }

    // 7. 메인 프로세싱 루프 (비디오 재생 시 실행)
    video.addEventListener('play', () => {
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        mainInterval = setInterval(async () => {
            if (video.paused || video.ended) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // -- A. 차선 이탈 방지 로직 (브라우저 기반 픽셀 스캔 시뮬레이션) --
            if (isLaneDetectionOn) {
                const width = canvas.width;
                const height = canvas.height;
                
                // 가상의 차선 인식 영역(ROI) 그리기
                ctx.strokeStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(width * 0.3, height * 0.6); // 상단 좌측
                ctx.lineTo(width * 0.7, height * 0.6); // 상단 우측
                ctx.lineTo(width * 0.9, height);       // 하단 우측
                ctx.lineTo(width * 0.1, height);       // 하단 좌측
                ctx.closePath();
                ctx.stroke();

                // 캔버스에 비디오 프레임을 임시로 그리고 픽셀 데이터를 분석 (간단한 밝기 기반)
                ctx.drawImage(video, 0, 0, width, height);
                const frameData = ctx.getImageData(0, height * 0.6, width, height * 0.4);
                ctx.clearRect(0, 0, width, height); // 분석 후 프레임 지우기 (비디오 요소가 보여짐)

                // 임의의 알고리즘: 양쪽 끝 픽셀의 밝기 변화를 감지하여 차선 이탈을 판별 (시뮬레이션 로직)
                // 실제 운행 시에는 하얀색/노란색 필터링이 들어갑니다.
                let leftIntensity = 0;
                let rightIntensity = 0;
                
                // 픽셀 스캔 (성능을 위해 듬성듬성 스캔)
                for (let i = 0; i < frameData.data.length; i += 16) {
                    const x = (i / 4) % width;
                    const r = frameData.data[i];
                    const g = frameData.data[i+1];
                    const b = frameData.data[i+2];
                    
                    // 밝은 색상(차선)일 경우 가중치 증가
                    if (r > 180 && g > 180 && b > 180) {
                        if (x < width * 0.3) leftIntensity++;
                        if (x > width * 0.7) rightIntensity++;
                    }
                }

                // 한쪽으로 차선(밝은 픽셀)이 과도하게 쏠리면 이탈로 간주
                if (leftIntensity > rightIntensity * 3 || rightIntensity > leftIntensity * 3) {
                    triggerLaneDepartureWarning();
                } else {
                    resetWarning();
                }
            }

            // -- B. 얼굴 추적 로직 --
            if (isFaceTrackingOn) {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
                const resizedDetections = faceapi.resizeResults(detections, displaySize);

                resizedDetections.forEach(detection => {
                    const box = detection.box;
                    ctx.strokeStyle = 'var(--box-color)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(box.x, box.y, box.width, box.height, 8);
                    ctx.stroke();
                });
            }

            // 둘 다 활성화되어 있을 때 ROI 영역 다시 렌더링 유지
            if(isLaneDetectionOn) {
                ctx.strokeStyle = videoWrapper.classList.contains('warning') ? 'rgba(231, 76, 60, 0.8)' : 'rgba(46, 204, 113, 0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.3, canvas.height * 0.6);
                ctx.lineTo(canvas.width * 0.7, canvas.height * 0.6);
                ctx.lineTo(canvas.width * 0.9, canvas.height);
                ctx.lineTo(canvas.width * 0.1, canvas.height);
                ctx.closePath();
                ctx.stroke();
            }

        }, 150); // 성능 최적화를 위해 150ms 프레임 제어
    });

    window.addEventListener('resize', () => {
        if (video.srcObject) {
            faceapi.matchDimensions(canvas, { width: video.clientWidth, height: video.clientHeight });
        }
    });

    initModels();
</script>
</body>
</html>
